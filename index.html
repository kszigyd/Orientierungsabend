<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Das grosse Deutsch-Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#fffaf0;
  --rule:#d4e5f6;
  --margin:#f2a2a2;
  --ink:#2b2340;
  --ink-soft:#5d5573;
  --card:#ffffff;
  --edge:#2b2340;
  --tile:#ffe2a0;
  --tile-ink:#3b2a12;
  --pick:#fff0a8;
  --note:#fff3a0;
  --note-ink:#3a3320;
  --sheet:#fffdf6;
  --good:#1a9e60;
  --bad:#e23f52;
  --think:#8f5ae0;
  --sun:#ffd23f;
  --floater-op:.17;
  --scrim:rgba(43,35,64,.3);
  --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",cursive;
  --round:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#1d3a2e; --rule:rgba(255,255,255,.05); --margin:rgba(255,160,160,.22);
    --ink:#f6f2e7; --ink-soft:#c6d3c4; --card:#284b3c; --edge:#ece6d4;
    --tile:#e8c876; --tile-ink:#2a1f0c; --pick:#55602c; --note:#e6da8a; --note-ink:#2a2614;
    --sheet:#2b5040; --good:#2bbf78; --bad:#f0596a; --floater-op:.11; --scrim:rgba(0,0,0,.45);
    --floater-force:#fffef4;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#1d3a2e; --rule:rgba(255,255,255,.05); --margin:rgba(255,160,160,.22);
  --ink:#f6f2e7; --ink-soft:#c6d3c4; --card:#284b3c; --edge:#ece6d4;
  --tile:#e8c876; --tile-ink:#2a1f0c; --pick:#55602c; --note:#e6da8a; --note-ink:#2a2614;
  --sheet:#2b5040; --good:#2bbf78; --bad:#f0596a; --floater-op:.11; --scrim:rgba(0,0,0,.45);
  --floater-force:#fffef4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 86px,var(--margin) 86px,var(--margin) 89px,transparent 89px),
    repeating-linear-gradient(180deg,transparent 0 40px,var(--rule) 40px 42px);
  color:var(--ink);
  font-family:var(--round);
  overflow:hidden;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
  -webkit-touch-callout:none;
}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:4px dashed var(--think);outline-offset:4px}

/* ---------- Hintergrund ---------- */
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floater{position:absolute;font-family:var(--round);font-weight:800;line-height:1;color:var(--floater-force,var(--c));opacity:var(--floater-op);animation:drift var(--d) ease-in-out infinite alternate;transform:rotate(var(--r))}
.doodle{position:absolute;color:var(--floater-force,var(--ink));opacity:calc(var(--floater-op) + .05)}
@keyframes drift{from{transform:translateY(-12px) rotate(var(--r))}to{transform:translateY(12px) rotate(calc(var(--r) + 7deg))}}

#app{position:relative;z-index:1;height:100%}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:18px 30px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* ---------- Knöpfe ---------- */
.btn{font:800 26px/1.1 var(--round);padding:14px 30px;border:4px solid var(--edge);border-radius:999px;box-shadow:0 6px 0 var(--edge);background:var(--sun);color:#2b2340;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.btn.big{font-size:34px;padding:16px 44px;background:#ff5d73;color:#fff}
.btn.big small{display:block;font-size:17px;font-weight:600;opacity:.95}
.btn.big[data-act="quick"]{font-size:44px;padding:21px 57px;border-width:5px;box-shadow:0 8px 0 var(--edge)}
.btn.big[data-act="quick"] small{font-size:22px}
.btn.big[data-act="quick"]:active{transform:translateY(5px);box-shadow:0 3px 0 var(--edge)}
@media (max-height:760px) and (min-width:921px){.btn.big[data-act="quick"]{font-size:39px;padding:16px 49px}}
.btn.alt{background:var(--card);color:var(--ink)}

/* ---------- Start ---------- */
.start{align-items:center;justify-content:center;gap:16px;text-align:center}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{position:relative;width:76px;height:82px;display:grid;place-items:center;background:var(--tile);color:var(--tile-ink);border:4px solid var(--edge);border-radius:14px;box-shadow:0 6px 0 var(--edge);font:800 50px/1 var(--round);transform:rotate(var(--r));padding:0}
.tile sub{position:absolute;right:7px;bottom:5px;font-size:15px;line-height:1}
.tile.color{background:var(--c);color:#fff}
.tile.wig{animation:wig .5s}
@keyframes wig{0%,100%{transform:rotate(var(--r))}25%{transform:rotate(calc(var(--r) - 14deg)) scale(1.1)}60%{transform:rotate(calc(var(--r) + 10deg)) scale(1.06)}}
.subtitle{margin:6px 0 4px;font:600 24px/1.3 var(--round);color:var(--ink-soft)}
.subtitle .hand{font-family:var(--hand);font-size:30px;color:var(--ink)}
.play-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.hint{margin:8px 0 0;font:28px/1 var(--hand);color:var(--ink-soft)}
.cats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px;width:min(1100px,100%)}
.cat{background:var(--card);border:4px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--edge);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 17px/1.1 var(--round);transition:transform .08s,box-shadow .08s}
.cat:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.ico{width:54px;height:54px;border-radius:50%;background:var(--c);border:3px solid var(--edge);display:grid;place-items:center;font-size:27px;color:#fff;font-weight:800}
.ico.comma{font-size:52px;line-height:0;padding-bottom:22px}
.cat small{font-weight:500;font-size:14px;color:var(--ink-soft)}

/* ---------- Quiz ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex:none}
.round{width:58px;height:58px;border-radius:999px;border:4px solid var(--edge);background:var(--card);box-shadow:0 5px 0 var(--edge);font-size:26px;display:grid;place-items:center;padding:0;flex:none;white-space:nowrap;transition:background .2s}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.round.armed{width:auto;padding:0 18px;background:#ff5d73;color:#fff;font:800 18px var(--round)}
.count{font:800 24px var(--round);min-width:76px;text-align:center}
.prog{flex:1;height:24px;border:4px solid var(--edge);border-radius:999px;background:var(--card);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--sun) 0 14px,#ffb71f 14px 28px);transition:width .45s}
.score{display:flex;align-items:center;gap:6px;border:4px solid var(--edge);border-radius:999px;background:var(--card);padding:4px 18px;font:800 24px var(--round)}
.score.bump{animation:pop .5s}

.qcard{--c:#ff8a3d;position:relative;flex:1;min-height:0;margin-top:26px;background:var(--card);border:4px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);padding:24px 30px 24px;display:flex;flex-direction:column;gap:14px}
.qcard::before{content:"";position:absolute;top:-17px;left:50%;width:150px;height:30px;background:var(--c);opacity:.8;transform:translateX(-50%) rotate(-3deg);border-radius:3px}
.qcard.in{animation:cardin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:translateY(24px) rotate(-1.5deg);opacity:0}to{transform:none;opacity:1}}
.badges{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;border:3px solid var(--edge);border-radius:999px;padding:3px 16px 3px 4px;font:800 19px var(--round)}
.chip .ico{width:34px;height:34px;font-size:18px;border-width:0;background:rgba(255,255,255,.25)}
.chip .ico.comma{font-size:36px;padding-bottom:16px}
.diff{font-size:26px;letter-spacing:2px;color:#ffb400;-webkit-text-stroke:1.5px var(--edge)}
.diff .off{color:transparent}
.denk{font:26px var(--hand);color:var(--think)}
.qtext{margin:0;font:800 clamp(24px,2.9vw,34px)/1.2 var(--round);text-wrap:balance}
.note{align-self:flex-start;max-width:100%;background:var(--note);color:var(--note-ink);font:27px/1.35 var(--hand);padding:12px 24px;border-radius:4px;box-shadow:3px 5px 0 rgba(0,0,0,.14);transform:rotate(-1deg);white-space:pre-line}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
.answers.three{grid-template-columns:repeat(3,1fr)}
.ans{--lc:#ff8a3d;display:flex;align-items:center;gap:14px;min-height:78px;padding:10px 18px 10px 12px;text-align:left;background:var(--card);border:4px solid var(--edge);border-radius:20px;box-shadow:0 6px 0 var(--edge);font:600 22px/1.2 var(--round);transition:transform .08s,box-shadow .08s,background .2s,opacity .3s}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.let{flex:none;width:46px;height:46px;border-radius:14px;background:var(--lc);color:#fff;border:3px solid var(--edge);display:grid;place-items:center;font:800 24px var(--round)}
.ans.caps .txt{text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.ans.picked{background:var(--pick);transform:translateY(2px);box-shadow:0 4px 0 var(--edge)}
.ans.picked .let{transform:rotate(-8deg) scale(1.08)}
.ans.right{background:var(--good);color:#fff;animation:pop .5s}
.ans.wrong{background:var(--bad);color:#fff;animation:shake .5s}
.ans.thought{background:var(--think);color:#fff;animation:pop .5s}
.ans.dim{opacity:.4}
.answers.done .ans{pointer-events:none}

.actions{display:flex;justify-content:center;padding-top:18px;flex:none}
.btn.reveal.ready{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ---------- Erklärung ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:21;width:min(980px,94vw);max-height:68%;overflow-y:auto;transform:translate(-50%,112%);transition:transform .5s cubic-bezier(.2,1.15,.4,1);background:var(--sheet);border:4px solid var(--edge);border-bottom:none;border-radius:30px 30px 0 0;padding:22px 34px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{margin:0 0 4px;font:800 36px/1.1 var(--round)}
.sheet h2.right{color:var(--good)}
.sheet h2.wrong{color:var(--bad)}
.sheet h2.denk{color:var(--think)}
.sol{margin:0 0 10px;font:600 22px/1.3 var(--round)}
.sol mark{background:linear-gradient(transparent 52%,rgba(255,210,63,.7) 52%);color:inherit;padding:0 4px}
.plus{font-family:var(--hand);font-size:26px;color:var(--think)}
.ex{margin:0 0 16px;font:500 22px/1.5 var(--round);max-width:62ch}
.sheet .row{display:flex;justify-content:flex-end}

/* ---------- Ende ---------- */
.end{align-items:center;justify-content:center}
.endcard{width:min(920px,100%);background:var(--card);border:4px solid var(--edge);border-radius:30px;box-shadow:0 8px 0 var(--edge);padding:24px 40px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:cardin .6s cubic-bezier(.2,1.3,.4,1)}
.trophy{font-size:70px;line-height:1}
.endtitle{margin:0;font:800 44px/1.1 var(--round)}
.bigscore{font:800 58px/1 var(--round)}
.bigscore span{font-size:26px;font-weight:600;color:var(--ink-soft)}
.stars{display:flex;gap:10px;font-size:62px;line-height:1;color:#ffb400;-webkit-text-stroke:2px var(--edge)}
.stars .off{color:transparent}
.endmsg{margin:4px 0;font:500 23px/1.45 var(--round);max-width:58ch}
.teaser{margin:8px 0 14px}
.teaser h3{margin:0 0 10px;font:28px var(--hand);font-weight:400;color:var(--ink-soft)}
.tchips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tchips span{background:var(--pick);border:3px solid var(--edge);border-radius:999px;padding:6px 16px;font:700 19px var(--round)}

/* ---------- Schullogo ---------- */
.logo{position:absolute;top:16px;left:22px;z-index:2;background:#fff;border:3px solid var(--edge);border-radius:14px;box-shadow:0 4px 0 var(--edge);padding:8px 14px;transform:rotate(-1.5deg);line-height:0}
.logo img{display:block;height:50px;width:auto}
@media (max-width:920px){.logo{position:static;align-self:flex-start;margin-bottom:6px}.logo img{height:38px}}

/* ---------- Schulhaus-Bild ---------- */
.photo{position:absolute;top:14px;right:24px;z-index:2;background:#fff;border:3px solid var(--edge);border-radius:10px;box-shadow:0 4px 0 var(--edge);padding:8px;transform:rotate(2.5deg);line-height:0}
.photo::before{content:"";position:absolute;top:-13px;left:50%;width:84px;height:24px;background:rgba(255,210,63,.8);transform:translateX(-50%) rotate(-4deg);border-radius:2px}
.photo img{display:block;height:150px;width:auto;border-radius:4px}
@media (max-height:760px) and (min-width:921px){.photo img{height:128px}}
@media (max-width:920px){.photo{display:none}}

/* ---------- Fun Facts ---------- */
.facts-btn{background:#8f5ae0;color:#fff}
.facts{align-items:center;gap:16px}
.facts .topbar{width:100%}
.ftitle{flex:1;margin:0;text-align:center;font:800 36px/1.1 var(--round)}
.fcard{--c:#ff7f32;--rot:-1.2deg;position:relative;flex:1;min-height:0;width:min(940px,100%);margin-top:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow-y:auto;
  background-color:var(--card);background-image:repeating-linear-gradient(180deg,transparent 0 44px,var(--rule) 44px 46px);
  border:4px solid var(--edge);border-top:18px solid var(--c);border-radius:24px;box-shadow:0 8px 0 var(--edge);padding:26px 56px;transform:rotate(var(--rot));touch-action:pan-y}
.fcard.in-r{animation:inR .45s cubic-bezier(.2,1.2,.4,1)}
.fcard.in-l{animation:inL .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes inR{from{transform:translateX(70px) rotate(var(--rot));opacity:0}to{transform:rotate(var(--rot));opacity:1}}
@keyframes inL{from{transform:translateX(-70px) rotate(var(--rot));opacity:0}to{transform:rotate(var(--rot));opacity:1}}
.femoji{font:800 84px/1 var(--round);color:var(--c)}
.fcard h2{margin:0;font:800 clamp(28px,3.2vw,40px)/1.15 var(--round);text-wrap:balance}
.fcard p{margin:0;max-width:44ch;font:500 clamp(21px,2.3vw,27px)/1.5 var(--round);overflow-wrap:break-word;-webkit-hyphens:manual;hyphens:manual}
.fnav{display:flex;gap:16px;flex:none}
.fhint{margin:0;font:24px/1 var(--hand);color:var(--ink-soft)}

#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.conf{position:absolute;top:0;display:block}

/* ---------- kleinere Bildschirme ---------- */
@media (max-width:920px){
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .answers,.answers.three{grid-template-columns:1fr}
  .tile{width:60px;height:66px;font-size:40px}
  .screen{padding:14px 18px}
}
@media (max-height:760px) and (min-width:921px){
  .tile{width:66px;height:70px;font-size:42px}
  .btn.big{font-size:30px;padding:12px 38px}
  .cat{padding:8px 4px}
  .ico{width:46px;height:46px;font-size:23px}
  .qcard{padding:20px 26px;gap:10px;margin-top:22px}
  .ans{min-height:70px;font-size:21px}
  .note{font-size:25px;padding:8px 20px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

const RIGHT = ["Richtig! 🎉","Volltreffer! 🎯","Genau! 🌟","Bravo! 👏","Stark! 💪"];
const WRONG = ["Knapp daneben! 🙈","Fast! Nächstes Mal klappt’s.","Nicht ganz – aber jetzt weisst du’s! 💡"];
const LC = ["#ff7f32","#4a84f5","#1a9e60","#e3417f"];

const $ = id => document.getElementById(id);
const card=$("card"), sheet=$("sheet"), scrim=$("scrim"), revealBtn=$("reveal"), homeBtn=$("home"), fx=$("fx");
const state = {list:[], i:0, score:0, choice:null, revealed:false};
let current = "start";

const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

/* abwechslungsreiche Reihenfolge: Themen reihum */
function balanced(list,n){
  const groups = shuffle(Object.keys(CATS)).map(k=>shuffle(list.filter(q=>q.cat===k))).filter(g=>g.length);
  const out=[]; let k=0;
  while(out.length<n && groups.some(g=>g.length)){ const g=groups[k%groups.length]; if(g.length) out.push(g.shift()); k++; }
  return out;
}
function prep(q){
  const opts = q.a.map((t,i)=>({t, ok:i===q.c}));
  return {...q, opts: q.keep ? opts : shuffle(opts)};
}

/* ---------- Start ---------- */
function buildStart(){
  const t1=[["D",1],["E",1],["U",1],["T",1],["S",1],["C",4],["H",2]];
  const t2=[["Q",10,"#ff5d73"],["U",1,"#4a84f5"],["I",1,"#1a9e60"],["Z",3,"#e9a100"]];
  const rot=()=>(Math.random()*10-5).toFixed(1)+"deg";
  $("t1").innerHTML=t1.map(([l,v])=>`<button class="tile" style="--r:${rot()}" aria-hidden="true" tabindex="-1">${l}<sub>${v}</sub></button>`).join("");
  $("t2").innerHTML=t2.map(([l,v,c])=>`<button class="tile color" style="--r:${rot()};--c:${c}" aria-hidden="true" tabindex="-1">${l}<sub>${v}</sub></button>`).join("");
  $("cats").innerHTML=Object.entries(CATS).map(([k,c])=>{
    const n=Q.filter(q=>q.cat===k).length;
    return `<button class="cat" data-act="cat" data-cat="${k}" style="--c:${c.c}"><span class="ico${c.ico===","?" comma":""}">${c.ico}</span>${c.name}<small>${n} Fragen</small></button>`;
  }).join("");
  
}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));
  current=id; closeSheet(); disarmHome();
}
function goStart(){ show("start"); }

function start(list){
  state.list=list.map(prep); state.i=0; state.score=0;
  $("pts").textContent="0";
  show("quiz"); renderQ();
}

/* ---------- Frage ---------- */
function renderQ(){
  const q=state.list[state.i], cat=CATS[q.cat], n=state.list.length;
  state.choice=null; state.revealed=false;
  const denk = q.c===undefined;
  card.style.setProperty("--c",cat.c);
  const diff = denk
    ? `<span class="denk">💭 Denkfrage – jede Antwort zählt!</span>`
    : `<span class="diff" aria-label="Schwierigkeit ${q.d} von 3">${"★".repeat(q.d)}<span class="off">${"★".repeat(3-q.d)}</span></span>`;
  card.innerHTML = `
    <div class="badges"><span class="chip"><span class="ico${cat.ico===","?" comma":""}">${cat.ico}</span>${cat.name}</span>${diff}</div>
    <h1 class="qtext">${q.q}</h1>
    ${q.s?`<div class="note">${q.s}</div>`:""}
    <div class="answers${q.opts.length===3?" three":""}" id="answers">
      ${q.opts.map((o,i)=>`<button class="ans${q.caps?" caps":""}" data-i="${i}" style="--lc:${LC[i]}"><span class="let">${"ABCD"[i]}</span><span class="txt">${o.t}</span></button>`).join("")}
    </div>`;
  card.classList.remove("in"); void card.offsetWidth; card.classList.add("in");
  card.scrollTop=0;
  $("count").textContent=`${state.i+1} / ${n}`;
  $("bar").style.width=`${(state.i+1)/n*100}%`;
  revealBtn.textContent="💡 Lösung aufdecken";
  revealBtn.classList.remove("ready");
}

function choose(i){
  if(state.revealed) return;
  state.choice=i;
  document.querySelectorAll("#answers .ans").forEach((b,k)=>b.classList.toggle("picked",k===i));
  revealBtn.classList.add("ready");
}

function reveal(){
  if(state.revealed){ openSheet(); return; }
  state.revealed=true;
  const q=state.list[state.i], denk=q.c===undefined, box=$("answers");
  const btns=[...box.children];
  box.classList.add("done");
  let res;
  if(denk){
    btns.forEach((b,i)=>{ if(i===state.choice) b.classList.add("thought"); else if(state.choice!==null) b.classList.add("dim"); });
    res="denk";
    if(state.choice!==null) addPoint();
  } else {
    btns.forEach((b,i)=>{
      if(q.opts[i].ok) b.classList.add("right");
      else if(i===state.choice) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    if(state.choice===null) res="none";
    else if(q.opts[state.choice].ok){ res="right"; addPoint(); confetti(55); }
    else res="wrong";
  }
  revealBtn.classList.remove("ready");
  revealBtn.textContent="📖 Erklärung nochmal lesen";
  buildSheet(res,q);
  setTimeout(openSheet, res==="none"?150:750);
}

function addPoint(){
  state.score++;
  const s=$("score"); $("pts").textContent=state.score;
  s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
}

function buildSheet(res,q){
  const right=q.opts.find(o=>o.ok);
  let h, sub="";
  if(res==="denk"){
    h="💭 Spannende Frage, oder?";
    sub=`<p class="sol">Hier gibt’s kein Richtig oder Falsch.${state.choice!==null?` <span class="plus">+1 Punkt fürs Mitdenken!</span>`:""}</p>`;
  } else {
    h = res==="right"?pick(RIGHT) : res==="wrong"?pick(WRONG) : "Die Auflösung 💡";
    sub=`<p class="sol">Richtige Antwort: <mark>${right.t}</mark></p>`;
  }
  const last=state.i===state.list.length-1;
  sheet.innerHTML=`<h2 class="${res}">${h}</h2>${sub}<p class="ex">${q.ex}</p>
    <div class="row"><button class="btn" data-act="next">${last?"Zum Ergebnis 🏁":"Nächste Frage"}</button></div>`;
}
function openSheet(){ sheet.scrollTop=0; sheet.classList.add("on"); scrim.classList.add("on"); }
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); }

function next(){
  closeSheet();
  if(state.i+1<state.list.length){ state.i++; setTimeout(renderQ,220); }
  else setTimeout(showEnd,260);
}

/* ---------- Ergebnis ---------- */
function showEnd(){
  const n=state.list.length, s=state.score, p=s/n;
  const st = p>=.8?3 : p>=.5?2 : p>=.2?1 : 0;
  const [icon,title,msg] = st===3
    ? ["🏆","Wow, ein echtes Sprachgenie!","Du hast den Durchblick bei Wörtern, Sätzen und Geschichten. Im Gymi wartet noch viel mehr auf dich!"]
    : st===2
    ? ["🎉","Super gemacht!","Du weisst schon eine ganze Menge über Sprache. Den Rest entdeckst du im Gymi – versprochen!"]
    : ["💪","Gut gekämpft!","Einiges war neu für dich? Perfekt – genau dafür gibt es den Deutschunterricht am Gymi. Dort lernst du all das und noch viel mehr."];
  $("endcard").innerHTML=`
    <div class="trophy">${icon}</div>
    <h1 class="endtitle">${title}</h1>
    <div class="bigscore">${s} <span>von ${n} Punkten</span></div>
    <div class="stars" aria-label="${st} von 3 Sternen">${[0,1,2].map(k=>`<span class="${k<st?"":"off"}">★</span>`).join("")}</div>
    <p class="endmsg">${msg}</p>
    <div class="teaser"><h3>Das erwartet dich im Deutschunterricht am Gymi:</h3>
      <div class="tchips"><span>📖 spannende Bücher</span><span>🎭 Theater spielen</span><span>✍️ eigene Geschichten schreiben</span><span>🗣️ diskutieren & philosophieren</span></div>
    </div>
    <button class="btn big" data-act="again">🔄 Nochmal spielen</button>`;
  show("end");
  confetti(st>=2?140:50);
}

/* ---------- Home mit Sicherheitsabfrage ---------- */
let armed=false, armT;
function homeTap(){
  if(armed){ goStart(); return; }
  armed=true; homeBtn.classList.add("armed"); homeBtn.textContent="🏠 Nochmal tippen zum Beenden";
  clearTimeout(armT); armT=setTimeout(disarmHome,2600);
}
function disarmHome(){ armed=false; clearTimeout(armT); homeBtn.classList.remove("armed"); homeBtn.textContent="🏠"; }

/* ---------- Konfetti ---------- */
function confetti(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=Object.values(CATS).map(c=>c.c).concat(["#ffd23f","#ff5d73"]);
  const h=innerHeight;
  for(let k=0;k<n;k++){
    const e=document.createElement("i"); e.className="conf";
    const w=8+Math.random()*8;
    e.style.cssText=`left:${Math.random()*100}vw;width:${w}px;height:${w*1.6}px;background:${cols[k%cols.length]};border-radius:${Math.random()<.3?"50%":"2px"}`;
    fx.appendChild(e);
    const dx=(Math.random()-.5)*260, rot=(Math.random()-.5)*900;
    const an=e.animate([{transform:"translate(0,-40px) rotate(0deg)"},{transform:`translate(${dx}px,${h+60}px) rotate(${rot}deg)`}],
      {duration:1700+Math.random()*1500, delay:Math.random()*350, easing:"cubic-bezier(.25,.5,.5,1)", fill:"both"});
    an.onfinish=()=>e.remove();
  }
}

/* ---------- Bedienung ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest(".tile,.ans,[data-act]"); if(!t) return;
  if(t.classList.contains("tile")){ t.classList.remove("wig"); void t.offsetWidth; t.classList.add("wig"); return; }
  if(t.classList.contains("ans")){ choose(+t.dataset.i); return; }
  const a=t.dataset.act;
  if(a==="quick") start(balanced(Q,10));
  else if(a==="all") start(balanced(Q,Q.length));
  else if(a==="cat") start(shuffle(Q.filter(q=>q.cat===t.dataset.cat)));
  else if(a==="next") next();
  else if(a==="again"||a==="home") goStart();
  else if(a==="facts") openFacts();
  else if(a==="fnext") stepFact(1);
  else if(a==="fprev") stepFact(-1);
});
revealBtn.addEventListener("click",reveal);
homeBtn.addEventListener("click",homeTap);
scrim.addEventListener("click",closeSheet);

/* Nach 2 Minuten ohne Berührung zurück zum Start – bereit für die nächsten Besucher */
let idleT;
function poke(){ clearTimeout(idleT); idleT=setTimeout(()=>{ if(current!=="start") goStart(); },120000); }
document.addEventListener("pointerdown",poke,true);

function openFacts(){ fi=0; show("facts"); renderFact(1); }
function renderFact(dir){
  const f=FACTS[fi], el=$("fcard");
  el.style.setProperty("--c",FCOL[fi%FCOL.length]);
  el.style.setProperty("--rot",(fi%2?1.2:-1.2)+"deg");
  el.innerHTML=`<div class="femoji">${f.e}</div><h2>${f.t}</h2><p>${f.x}</p>`;
  el.classList.remove("in-l","in-r"); void el.offsetWidth; el.classList.add(dir<0?"in-l":"in-r");
  $("fcount").textContent=`${fi+1} / ${FACTS.length}`;
}
function stepFact(d){ fi=(fi+d+FACTS.length)%FACTS.length; renderFact(d); }
let sx=null;
$("fcard").addEventListener("pointerdown",e=>{ sx=e.clientX; });
$("fcard").addEventListener("pointerup",e=>{ if(sx!==null){ const dx=e.clientX-sx; if(Math.abs(dx)>60) stepFact(dx<0?1:-1); } sx=null; });
